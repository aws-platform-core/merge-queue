name: ARM Merge Queue Authorization

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  arm-merge-group:
    runs-on: ubuntu-latest

    steps:

      - name: Get merge group information
        id: merge-group
        env:
          MERGE_GROUP_SHA: ${{ github.sha }}
          MERGE_GROUP_REF: ${{ github.ref }}
        run: |
          echo "Merge group SHA: ${MERGE_GROUP_SHA}"
          echo "Merge group ref: ${MERGE_GROUP_REF}"

          # Example:
          # refs/heads/gh-readonly-queue/main/pr-3-a5a18c7...

          PR_NUMBER=$(echo "${MERGE_GROUP_REF}" | sed -n 's|.*/pr-\([0-9]*\)-.*|\1|p')

          if [ -z "${PR_NUMBER}" ]; then
            echo "ERROR: Could not extract PR number from merge group ref"
            exit 1
          fi

          echo "PR number: ${PR_NUMBER}"

          echo "PR_NUMBER=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Get PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.merge-group.outputs.PR_NUMBER }}
        run: |

          PR_HEAD_SHA=$(gh api \
            "/repos/${REPO}/pulls/${PR_NUMBER}" \
            --jq '.head.sha')

          echo "PR #${PR_NUMBER}"
          echo "PR HEAD SHA: ${PR_HEAD_SHA}"

          echo "PR_HEAD_SHA=${PR_HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Check ARM status on PR HEAD
        id: arm-check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.PR_HEAD_SHA }}
        run: |

          ARM_STATUS=$(gh api \
            "/repos/${REPO}/commits/${PR_HEAD_SHA}/status" \
            --jq '[.statuses[] | select(.context=="arm-status")] | last | .state // "missing"')

          echo "ARM status on PR HEAD: ${ARM_STATUS}"

          if [ "${ARM_STATUS}" != "success" ]; then
            echo "ARM has NOT approved this PR."
            exit 1
          fi

          echo "ARM has approved this PR."

      - name: Clear ARM status on merge group
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_GROUP_SHA: ${{ github.sha }}
        run: |
          echo "Clearing arm-status on merge-group SHA:"
          echo "${MERGE_GROUP_SHA}"
      
          gh api \
            --method POST \
            "/repos/${REPO}/statuses/${MERGE_GROUP_SHA}" \
            --field state="success" \
            --field context="arm-status" \
            --field description="ARM approval propagated from PR"

          echo "ARM status cleared on merge-group SHA."
